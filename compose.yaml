name: knotdevt-k010
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knotdevt
      POSTGRES_USER: knotdevt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate local settings first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knotdevt -d knotdevt"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
